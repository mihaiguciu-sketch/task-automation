<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Raport final tură</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --accent:#0f7a4c; --accent-dark:#0b5c39; --text:#1f2933;
    --muted:#6b7280; --border:#e2e5e9; --danger:#c0392b; --warn:#b9770e;
  }
  *{box-sizing:border-box;}
  body{font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px 16px 110px; line-height:1.4;}
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:19px; margin:0 0 2px;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  label.nm{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:4px;}
  input#opName{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px;}
  input#opName.err{border-color:var(--danger); background:#fceceb;}
  .progress{font-size:13px; font-weight:600; color:var(--accent-dark); margin:12px 2px 8px;}
  .bar{height:8px; background:#e3e7ea; border-radius:6px; overflow:hidden; margin-bottom:12px;}
  .bar > div{height:100%; background:var(--accent); width:0; transition:width .2s;}
  .q{font-size:14.5px; font-weight:600; word-break:break-word; margin-bottom:8px;}
  .sect{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 2px 8px;}
  .opts{display:flex; gap:6px;}
  .opts button{flex:1; padding:11px 4px; border:1px solid var(--border); background:#fff; color:var(--text); border-radius:8px; font-family:inherit; font-size:13.5px; cursor:pointer; line-height:1.2;}
  .opts button.sel-y{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  .opts button.sel-n{background:var(--danger); border-color:var(--danger); color:#fff; font-weight:700;}
  .opts button.sel-p{background:var(--warn); border-color:var(--warn); color:#fff; font-weight:700;}
  .hint{font-size:12.5px; color:var(--muted); margin:14px 2px;}
  .err-box{background:#fceceb; border:1px solid var(--danger); color:var(--danger); padding:14px; border-radius:10px;}
  .sendbar{position:fixed; left:0; right:0; bottom:0; background:rgba(244,246,248,.96); border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .sendbar button{display:block; width:100%; max-width:640px; margin:0 auto; background:#25D366; color:#fff; border:none; padding:14px; font-size:15px; font-weight:700; border-radius:10px; font-family:inherit; cursor:pointer;}
  .sendbar button:disabled{background:#cfd6dc; color:#5b6670; font-weight:600; cursor:default;}
  .sendbar .sentnote{max-width:640px; margin:0 auto 6px; font-size:12px; color:var(--accent-dark); text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
const I18N = {
  ro: {
    title:'Raport final tură', name:'Numele tău', namePh:'ex: Ion Marin', nameNeed:'Scrie mai întâi numele tău.',
    yes:'Da', no:'Nu', part:'Parțial',
    tasks:'Taskuri', gear:'Utilaje și ustensile',
    qMach:'🔧 Utilajele au fost curățate, verificate și depozitate în locurile stabilite?',
    qTools:'🧹 Ustensilele au fost curățate și depozitate în locurile stabilite?',
    answered:'răspunsuri date', hint:'Răspunde la fiecare întrebare la finalul turei: Da (făcut complet), Nu (nefăcut) sau Parțial (are nevoie de mai mult timp). Apoi apasă butonul verde: se deschide WhatsApp, alegi grupul de lucru și apeși Trimite. Răspunsurile rămân salvate dacă închizi pagina.',
    send:'📤 Trimite raportul pe WhatsApp', resend:'📤 Retrimite raportul pe WhatsApp', missing:'Mai ai de răspuns la', missingEnd:'întrebări',
    sentNote:'✔ Raport trimis. Dacă schimbi un răspuns, poți retrimite.',
    report:'📋 Raport final tură', invalid:'Link invalid sau incomplet. Cere din nou linkul din grupul de lucru.', shift:'Tura din'
  },
  en: {
    title:'End of shift report', name:'Your name', namePh:'e.g. John Smith', nameNeed:'Please enter your name first.',
    yes:'Yes', no:'No', part:'Need extra time',
    tasks:'Tasks', gear:'Machines and tools',
    qMach:'🔧 Were the machines cleaned, checked and stored in the designated places?',
    qTools:'🧹 Were the tools and utensils cleaned and stored in the designated places?',
    answered:'answers given', hint:'Answer every question at the end of the shift: Yes (fully done), No (not done) or Need extra time. Then press the green button: WhatsApp opens, choose the work group and press Send. Your answers stay saved if you close the page.',
    send:'📤 Send report on WhatsApp', resend:'📤 Resend report on WhatsApp', missing:'Still to answer:', missingEnd:'questions',
    sentNote:'✔ Report sent. If you change an answer, you can resend.',
    report:'📋 End of shift report', invalid:'Invalid or incomplete link. Please ask for the link again in the work group.', shift:'Shift of'
  }
};

function decodePayload(h){
  try{
    const b64 = h.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(escape(atob(b64 + '='.repeat((4 - b64.length % 4) % 4))));
    const p = JSON.parse(json);
    if(!p) return null;
    if(p.v === 2) p.t = buildTitles(p);          // link scurt: titlurile se reconstruiesc din data.js
    if(!Array.isArray(p.t) || !p.t.length) return null;   // v1: titlurile vin direct în link
    return p;
  }catch(e){ return null; }
}

// reface lista numerotată de taskuri, în aceeași ordine ca în mesajul generat
function buildTitles(p){
  const en = p.l === 'en';
  const respLabel = en ? FIXED_EN.personInCharge : 'Responsabil';
  const titles = [];
  const actTitle = (entry, resp)=>{
    const id = Array.isArray(entry) ? entry[0] : entry;
    const fv = Array.isArray(entry) ? entry[1] : {};
    const a = activitati.find(x => x.id == id);
    if(!a) return null;
    let t = (en && activitatiEN[a.id]) ? activitatiEN[a.id].title : a.title;
    (a.fields || []).forEach(f=>{ t = t.replaceAll(`{{${f.key.toUpperCase()}}}`, fv[f.key] || '____'); });
    if(resp) t += ` (${respLabel}: ${resp})`;
    return t;
  };
  POINTS_META.forEach(pm=>{
    if(pm.type === 'fixed'){
      titles.push((p.o && p.o[pm.key]) || (en ? FIXED_TITLES_EN : FIXED_TITLES_RO)[pm.key]);
    } else {
      const n = pm.key === 'p3' ? '3' : '4';
      (p['a'+n] || []).forEach(e=>{ const t = actTitle(e, p['r'+n]); if(t) titles.push(t); });
    }
  });
  (p.c || []).forEach(t => titles.push(t));
  const numbered = titles.map((t, i) => `${i+1}. ${t}`);
  (p.x || []).forEach(t => numbered.push('➕ ' + t));
  return numbered;
}

function hash32(str){ let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5)+h + str.charCodeAt(i)) | 0; return (h>>>0).toString(36); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
function pad(n){ return String(n).padStart(2,'0'); }
function nowHM(){ const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function go(url){ location.href = url; }          // navigare directă (nu target=_blank)
function waUrl(text){ return 'https://wa.me/?text=' + encodeURIComponent(text); }

const rawHash = location.hash.replace(/^#/, '');
const payload = decodePayload(rawHash);
const L = I18N[(payload && payload.l) === 'en' ? 'en' : 'ro'];
const STORE_KEY = 'opAns:' + (payload ? (payload.d || '') + ':' + hash32(rawHash) : 'x');

// răspunsuri: cheile '0'..'N-1' pentru taskuri, 'm' = utilaje, 'k' = ustensile; valori y / n / p
let state = {ans:{}, sent:false};
try{ state = JSON.parse(localStorage.getItem(STORE_KEY)) || state; }catch(e){}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function getName(){ try{ return localStorage.getItem('opName') || ''; }catch(e){ return ''; } }

function allKeys(){ return payload.t.map((_, i) => String(i)).concat(['m', 'k']); }
function label(v){ return v === 'y' ? '✅ ' + L.yes : v === 'n' ? '❌ ' + L.no : '⚠️ ' + L.part; }

function setAns(key, v){
  state.ans[key] = v;
  state.sent = false;
  saveState();
  render();
}

function reportMessage(name){
  const lines = payload.t.map((t, i) => `${t}\n   ${label(state.ans[String(i)])}`);
  lines.push(`${L.qMach}\n   ${label(state.ans.m)}`);
  lines.push(`${L.qTools}\n   ${label(state.ans.k)}`);
  return `${L.report} – ${name} (${nowHM()})\n${fmtDate(payload.d)}\n\n${lines.join('\n')}`;
}

function sendReport(){
  const inp = document.getElementById('opName');
  const name = inp.value.trim();
  if(!name){ inp.classList.add('err'); inp.placeholder = L.nameNeed; inp.focus(); window.scrollTo(0, 0); return; }
  try{ localStorage.setItem('opName', name); }catch(e){}
  const missing = allKeys().filter(k => !state.ans[k]);
  if(missing.length) return;
  const text = reportMessage(name);
  state.sent = true;
  saveState();
  render();
  go(waUrl(text));
}

function optionsRow(key){
  const v = state.ans[key];
  const b = (val, cls, txt) => `<button class="${v === val ? 'sel-' + cls : ''}" onclick="setAns('${key}','${val}')">${esc(txt)}</button>`;
  return `<div class="opts">${b('y','y',L.yes)}${b('n','n',L.no)}${b('p','p',L.part)}</div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!payload){ app.innerHTML = `<div class="err-box">${esc(I18N.ro.invalid)}</div>`; return; }
  const keys = allKeys();
  const total = keys.length;
  const count = keys.filter(k => state.ans[k]).length;
  const left = total - count;
  const keepName = document.getElementById('opName') ? document.getElementById('opName').value : getName();
  app.innerHTML = `
    <h1>${esc(L.title)}</h1>
    <p class="sub">${esc(L.shift)} ${esc(fmtDate(payload.d))}</p>
    <div class="card">
      <label class="nm" for="opName">${esc(L.name)}</label>
      <input type="text" id="opName" value="${esc(keepName)}" placeholder="${esc(L.namePh)}" oninput="this.classList.remove('err')">
    </div>
    <div class="progress">${count} / ${total} ${esc(L.answered)}</div>
    <div class="bar"><div style="width:${Math.round(count/total*100)}%"></div></div>
    <div class="sect">${esc(L.tasks)}</div>
    ${payload.t.map((t, i) => `
      <div class="card">
        <div class="q">${esc(t)}</div>
        ${optionsRow(String(i))}
      </div>`).join('')}
    <div class="sect">${esc(L.gear)}</div>
    <div class="card"><div class="q">${esc(L.qMach)}</div>${optionsRow('m')}</div>
    <div class="card"><div class="q">${esc(L.qTools)}</div>${optionsRow('k')}</div>
    <p class="hint">${esc(L.hint)}</p>
    <div class="sendbar">
      ${state.sent && left === 0 ? `<div class="sentnote">${esc(L.sentNote)}</div>` : ''}
      ${left > 0
        ? `<button disabled>${esc(L.missing)} ${left} ${esc(L.missingEnd)}</button>`
        : `<button onclick="sendReport()">${esc(state.sent ? L.resend : L.send)}</button>`}
    </div>`;
}
render();
</script>
</body>
</html>
